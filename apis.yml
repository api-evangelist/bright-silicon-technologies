aid: bright-silicon-technologies
name: Bright Silicon Technologies
description: >-
  Bright Silicon Technologies is a Pleasanton, California photonics and semiconductor company,
  founded in 2020 out of work at Lawrence Livermore National Laboratory, that builds solid-state
  optical beam control. Its Lightfield Directing Array (LDA) is a chip-scale segmented micromirror
  array — described by the company as "400 micro-gimbals on a chip" — that steers light with no
  moving parts, offering a plus-or-minus 30 degree optical field of regard at sub-microradian
  precision, a 350k degrees/second slew rate and 100ns settling time. The company positions the LDA
  as a replacement for bulky mechanical gimbals and conventional MEMS mirrors in free-space optical
  communication terminals, LIDAR, counter-UAS tracking, adaptive optics and metal 3D printing. The
  product is silicon and optical hardware sold to aerospace, defense and datacenter customers; the
  company publishes no public developer program, API, or SDK.
